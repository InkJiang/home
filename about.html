<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03：关于</title>
  <link href="./assets/images/favicon.ico" rel="icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./assets/js/main.js" defer></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'sans': ['"Noto Serif SC"','Georgia','serif'],
            'serif': ['"Noto Serif SC"', 'Georgia',   'serif'],
          },
          colors: {
            ink: {
              50:'#f7f6f3',100:'#eceae3',200:'#d9d4c7',300:'#c1b89f',
              400:'#a89676',500:'#967e5d',600:'#876e51',700:'#705a44',
              800:'#5c4a3a',900:'#4c3e32',950:'#28201a',
            }
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    .nav-glass { background:transparent; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:background 0.4s,box-shadow 0.4s; }
    .nav-glass.scrolled { background:rgba(28,22,17,0.92); box-shadow:0 2px 24px rgba(0,0,0,0.18); }
    #mobile-menu { transition:max-height 0.35s ease,opacity 0.3s; max-height:0; opacity:0; overflow:hidden; }
    #mobile-menu.open { max-height:400px; opacity:1; }
  </style>
</head>

<body class="bg-ink-50 font-sans min-h-screen flex flex-col">

  <!-- 导航 -->
  <header id="navbar" class="nav-glass fixed top-0 left-0 right-0 z-50 bg-ink-950/80"></header>

  <!-- 主内容 -->
  <main class="pt-28 pb-20 flex-1">
    <div class="max-w-5xl mx-auto px-6">

      <!-- 标题 -->
      <div class="text-center mb-16">
        <p class="text-ink-400 text-xs tracking-[0.3em] uppercase mb-3">about</p>
        <h1 class="font-serif text-4xl md:text-5xl text-ink-900 tracking-wide font-bold">03：关于</h1>
        <div class="mt-5 w-16 h-px bg-ink-300 mx-auto"></div>
      </div>

      <!-- 内容区 -->
      <div class="grid md:grid-cols-2 gap-12 lg:gap-20 items-start">

        <!-- 左：文字 -->
        <div class="space-y-10">
          <section>
            <h2 class="font-serif text-xl text-ink-800 mb-4 flex items-center gap-3">
              <span class="text-ink-400 text-sm font-mono tracking-wider">Ⅰ</span>
              关于这个网站
            </h2>
            <p class="text-ink-600 leading-relaxed text-sm">上班无聊，摸鱼时做的。</p>
          </section>

          <div class="w-full h-px bg-ink-200"></div>

          <section>
            <h2 class="font-serif text-xl text-ink-800 mb-4 flex items-center gap-3">
              <span class="text-ink-400 text-sm font-mono tracking-wider">Ⅱ</span>
              关于我
            </h2>
            <div class="text-ink-600 leading-loose text-sm space-y-3">
              <p>人的一生是很短暂的，只有几十年的光阴。</p>
              <p>很多人直到钻入了骨灰盒，仍然不明白自己为什么活过一生。</p>
              <p>而通过写作，可以用文字将自己的想法永久地记录下来并流传后代。</p>
              <p>如果说一个人的人生有意义或价值的话，其意义和价值或许就在这里了。</p>
              <p class="text-ink-400 text-xs italic">网上抄的不明所以的句子……</p>
            </div>
          </section>

          <div class="w-full h-px bg-ink-200"></div>

          <section>
            <h2 class="font-serif text-xl text-ink-800 mb-4 flex items-center gap-3">
              <span class="text-ink-400 text-sm font-mono tracking-wider">Ⅲ</span>
              别的什么
            </h2>
            <p class="text-ink-600 leading-relaxed text-sm">没别的，就这样吧...</p>
            <p class="text-ink-600 leading-relaxed text-sm">对了，我爱跑步！</p>
          </section>
        </div>

        <!-- 右：图片 -->
        <div class="sticky top-28">
          <div class="rounded-2xl overflow-hidden shadow-lg">
            <img src="./assets/images/about.jpg" alt="about" class="w-full h-auto object-cover">
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- 页脚 -->
  <footer id="global-footer" class="bg-ink-950 border-t border-white/10 py-8"></footer>
</body>
</html>
