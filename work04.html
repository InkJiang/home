<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02：短文</title>
  <link href="./assets/images/favicon.ico" rel="icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { 'sans': ['"Noto Serif SC"','Georgia','serif'], 'serif': ['"Noto Serif SC"','Georgia','serif'] },
        colors: { ink: { 50:'#f7f6f3',100:'#eceae3',200:'#d9d4c7',300:'#c1b89f',400:'#a89676',500:'#967e5d',600:'#876e51',700:'#705a44',800:'#5c4a3a',900:'#4c3e32',950:'#28201a' } },
      }}
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    .nav-glass { background:transparent; backdrop-filter:blur(6px); transition:background 0.4s,box-shadow 0.4s; }
    .nav-glass.scrolled { background:rgba(28,22,17,0.92); box-shadow:0 2px 24px rgba(0,0,0,0.18); }
    #mobile-menu { transition:max-height 0.35s,opacity 0.3s; max-height:0; opacity:0; overflow:hidden; }
    #mobile-menu.open { max-height:400px; opacity:1; }
    .article-body p { margin-bottom:1.5rem; line-height:2; color:#4c3e32; }
    .article-body p img { max-width:100%; height:auto; border-radius:12px; margin:1.5rem auto; display:block; }
    /* 诗歌特殊样式 */
    .poem-stanza { text-align:center; line-height:2.4; color:#4c3e32; margin-bottom:2rem; font-family:"Noto Serif SC", Georgia, serif; }
  </style>
</head>
<body class="bg-ink-50 font-sans min-h-screen">
  <header id="navbar" class="nav-glass fixed top-0 left-0 right-0 z-50 bg-ink-950/80">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <!-- 桌面端导航链接：在移动端隐藏，md及以上显示 -->
      <div class="hidden md:flex items-center gap-6">
        <a href="./index.html" class="nav-link text-white/70 hover:text-white text-sm tracking-wider transition-colors duration-200">01：首页</a>
        <a href="./works.html"   class="text-white font-bold text-sm tracking-widest opacity-90 hover:opacity-100 transition-opacity">02：短文</a>
        <a href="./about.html"   class="nav-link text-white/70 hover:text-white text-sm tracking-wider transition-colors duration-200">03：关于</a>
        <a href="./contact.html" class="nav-link text-white/70 hover:text-white text-sm tracking-wider transition-colors duration-200">04：联系</a>
        <a href="./tool.html"    class="nav-link text-white/70 hover:text-white text-sm tracking-wider transition-colors duration-200">05：工具</a>
      </div>

      <!-- Mobile Hamburger (仅在移动端显示) -->
      <button id="menu-btn" class="md:hidden text-white p-2" aria-label="菜单">
        <svg id="icon-open"  class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg id="icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- 移动端下拉菜单 -->
    <div id="mobile-menu" class="md:hidden border-t border-white/10">
      <nav class="flex flex-col px-6 py-4 gap-4">
        <a href="./index.html"   class="text-white/70 hover:text-white text-sm tracking-wider py-1 transition-colors">01：首页</a>
        <a href="./works.html"   class="text-white hover:text-white text-sm tracking-wider py-1 transition-colors">02：短文</a>
        <a href="./about.html"   class="text-white/70 hover:text-white text-sm tracking-wider py-1 transition-colors">03：关于</a>
        <a href="./contact.html" class="text-white/70 hover:text-white text-sm tracking-wider py-1 transition-colors">04：联系</a>
        <a href="./tool.html"    class="text-white/70 hover:text-white text-sm tracking-wider py-1 transition-colors">05：工具</a>
      </nav>
    </div>
  </header>

   <!-- 顶部封面图 -->
   <div class="w-full h-72 sm:h-96 overflow-hidden">
     <img src="./assets/images/works-header.jpg" alt="封面" class="w-full h-full object-cover">
   </div>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 -mt-16 relative z-10 pb-20">
    <article class="bg-white rounded-3xl shadow-lg p-8 sm:p-12">
      <header class="mb-10 pb-8 border-b border-ink-100">
        <div class="flex items-baseline gap-4">
          <span class="text-ink-400 font-mono text-sm tracking-widest flex-shrink-0">004</span>
          <h1 class="font-serif text-2xl sm:text-3xl text-ink-900 leading-snug tracking-wide">雪纷纷扬扬飘飘洒洒地下着</h1>
        </div>
        <div class="mt-3 flex items-center gap-2">
          <div class="w-1.5 h-1.5 rounded-full bg-ink-300"></div>
          <p class="text-ink-400 text-xs tracking-widest">诗歌</p>
        </div>
      </header>

      <!-- 诗歌正文 -->
      <div class="py-4">
        <div class="poem-stanza text-sm sm:text-base">
          雪纷纷扬扬<br>
          飘飘洒洒地下着<br>
          在他的身后<br>
          雪越下越大<br>
          田野已积满苍白的颜色
        </div>

        <div class="my-6">
          <img src="./assets/images/work004-02.jpg" alt="雪景" class="max-w-full h-auto rounded-xl mx-auto">
        </div>

        <div class="poem-stanza text-sm sm:text-base">
          雪花曾答应给我一个承诺<br>
          只要把记忆咀嚼成一月的呼唤<br>
          就把雪地上的足迹留我
        </div>

        <div class="poem-stanza text-sm sm:text-base">
          心里伤痛<br>
          脸上带着哭喊的微笑<br>
          只见在他的肩上<br>
          凋零散落着什么
        </div>

        <div class="poem-stanza text-sm sm:text-base">
          晶莹一片片在他脚下停留<br>
          是呼唤声振撼了天<br>
          还是心的撕裂声感动了雪<br>
          真的没把他的足迹掩没
        </div>
      </div>
    </article>
    <nav class="mt-10 flex items-center justify-between">
      <a href="./work03.html" class="group flex items-center gap-2 text-ink-500 hover:text-ink-800 transition-colors">
        <svg class="w-5 h-5 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"/></svg>
        <span class="text-sm">上一篇</span>
      </a>
      <span class="text-ink-300 text-xs tracking-widest">004 / 006</span>
      <a href="./work05.html" class="group flex items-center gap-2 text-ink-500 hover:text-ink-800 transition-colors">
        <span class="text-sm">下一篇</span>
        <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"/></svg>
      </a>
    </nav>
  </main>

  <footer class="bg-ink-950 border-t border-white/10 py-8">
    <div class="max-w-6xl mx-auto px-6 text-center">
      <p class="text-white/40 text-xs tracking-widest">© InkJiang &nbsp;·&nbsp; 以文记心，以墨留痕</p>
    </div>
  </footer>
  <script>
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => navbar.classList.toggle('scrolled', window.scrollY > 60));
    document.getElementById('menu-btn').addEventListener('click', () => {
      document.getElementById('mobile-menu').classList.toggle('open');
      document.getElementById('icon-open').classList.toggle('hidden');
      document.getElementById('icon-close').classList.toggle('hidden');
    });
  </script>
</body>
</html>
